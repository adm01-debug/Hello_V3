project_id = "cfmlmcdyjuotqobjapng"

# As edges abaixo sao chamadas por pg_cron com um bearer opaco lido do Vault,
# nao um JWT. O gateway da Supabase valida o JWT ANTES da edge rodar e rejeita
# o token com UNAUTHORIZED_INVALID_JWT_FORMAT — foi por isso que a purga de
# optimistic_lock_conflicts ficou anos em 401 sem ninguem notar. Declarar aqui
# impede que um `supabase functions deploy` sem `--no-verify-jwt` reintroduza
# o bug; a autorizacao real (comparacao do token em tempo constante) fica no
# codigo de cada edge.

# ---------------------------------------------------------------------------
# verify_jwt declarado para as 99 edges (etapa 054).
#
# O default implicito (true) e exatamente o que ja custou anos de 401 silencioso:
# uma edge chamada por pg_cron com bearer opaco ou por webhook de terceiro recebia
# recusa do gateway ANTES de rodar. Cada valor abaixo foi conferido contra a
# producao em 28/11/2026 (POST sem Authorization em cada uma das 99):
#   - as 19 marcadas `false` respondem com a propria resposta (nunca
#     UNAUTHORIZED_NO_AUTH_HEADER / UNAUTHORIZED_INVALID_JWT_FORMAT);
#   - as 80 restantes continuam recusando no gateway e permanecem `true`.
#
# As `false` tem verificacao propria na edge: HMAC nos webhooks, requireUser nas
# de painel, comparacao de token do Vault nas de cron. Declarar aqui impede que
# um `supabase functions deploy` sem `--no-verify-jwt` mude a exposicao por acidente.
# ---------------------------------------------------------------------------

[functions.analyze-call]
verify_jwt = true

[functions.analyze-contact-profile]
verify_jwt = true

[functions.analyze-live-utterance]
verify_jwt = true

[functions.analyze-sentiment]
verify_jwt = true

# A edge e chamada por src/hooks/useTalkRatio.ts; o unico caminho de escrita e o invoke com o JWT do usuario do Supabase.
[functions.analyze-talk-ratio]
verify_jwt = true

# Link enviado por e-mail, aberto sem sessao.
