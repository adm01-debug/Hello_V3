project_id = "cfmlmcdyjuotqobjapng"

# As edges abaixo sao chamadas por pg_cron com um bearer opaco lido do Vault,
# nao um JWT. O gateway da Supabase valida o JWT ANTES da edge rodar e rejeita
# o token com UNAUTHORIZED_INVALID_JWT_FORMAT — foi por isso que a purga de
# optimistic_lock_conflicts ficou anos em 401 sem ninguem notar. Declarar aqui
# impede que um `supabase functions deploy` sem `--no-verify-jwt` reintroduza
# o bug; a autorizacao real (comparacao do token em tempo constante) fica no
# codigo de cada edge.
[functions.cleanup-lock-conflicts]
verify_jwt = false

[functions.cleanup-recordings]
verify_jwt = false

[functions.dialer-pacing-tick]
verify_jwt = false

[functions.generate-coaching-track]
verify_jwt = false

[functions.data-lake-flush]
verify_jwt = false

# Endpoint publico de lockout (usuario deslogado antes de autenticar). A edge
# roda com service role e limita por IP; o gateway nao pode exigir JWT aqui.
[functions.login-attempt]
verify_jwt = false

# Fila do CRM: o job de 5 min (migration 20261128110000) manda como Bearer o
# token opaco 'crm_sync_cron_token' lido do Vault, e a edge confere esse valor no
# banco via public.token_cron_valido(). Sem esta linha o gateway recusa o bearer
# antes da edge rodar e a fila volta a encher sem consumo.
[functions.sync-crm-queue]
verify_jwt = false
