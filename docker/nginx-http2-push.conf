http {
  # HTTP/2 Server Push
  http2_push_preload on;

  server {
    listen 443 ssl http2;
    server_name hello.app;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/hello.app.crt;
    ssl_certificate_key /etc/nginx/ssl/hello.app.key;

    # HTTP/2 settings
    http2_max_field_size 16k;
    http2_max_header_size 32k;

    # Push critical resources
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;

      # Push critical CSS
      add_header Link "</css/critical.css>; rel=preload; as=style" always;
      
      # Push fonts
      add_header Link "</fonts/inter-400-normal.woff2>; rel=preload; as=font; crossorigin" always;
      
      # Push main JS
      add_header Link "</js/main.js>; rel=preload; as=script" always;
    }

    # API routes
    location /api/ {
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;

      # Enable HTTP/2 Server Push for API responses
      http2_push /api/user/preferences;
    }

    # Static assets with aggressive caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      
      # Enable HTTP/2 Push for critical assets
      if ($uri ~* "critical") {
        add_header Link "<$uri>; rel=preload" always;
      }
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Brotli compression (if module enabled)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml text/javascript 
                 application/json application/javascript application/xml+rss;
  }
}
