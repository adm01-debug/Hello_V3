version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "adm01-debug"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    pull-request-branch-name:
      separator: "/"
    ignore:
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-patch"]
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
