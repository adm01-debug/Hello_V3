# docs:
#   gatilho: dispatch manual (nenhum push aplica DDL em producao). Pull request que toque
#     supabase/migrations/ ou supabase/tests/ roda SO os testes de RLS (read-only, tudo
#     revertido no fim) -- e o que impede um bug ja corrigido de voltar sem ninguem ver
#   prova: dry-run executa o arquivo e reverte; APLICAR grava e registra em public.schema_migrations
#   transacao: linhas BEGIN;/COMMIT;/ROLLBACK; do proprio arquivo sao neutralizadas antes de
#     executar -- o COMMIT do arquivo encerraria a transacao externa e o dry-run gravaria de
#     verdade. Quem controla a transacao e o psql (--single-transaction / begin+rollback)
#   modos: arquivo | pendentes | registrar | verificar
#     arquivo    -> aplica (ou simula) UM arquivo de supabase/migrations/
#     registrar  -> anota no historico um arquivo que ja esta no banco, SEM executar o SQL
#     pendentes  -> lista o que existe no repositorio e nao esta em public.schema_migrations e aplica em ordem
#     verificar  -> roda supabase/tests/*_rls_test.sql (transacoes revertidas no fim, nada fica gravado)
#   falha: nome fora do padrao, arquivo inexistente, versao ja aplicada, erro de SQL, secret ausente
#   alerta: toda segunda 12:00 UTC o levantamento da fila roda sozinho e abre uma issue quando ha
#     pendencia (fecha sozinho quando a fila zera). O agendamento NUNCA aplica nada: so lista.
#   sondas: toda segunda 12:00 UTC os testes de RLS rodam tambem (mesmo cron, mesmo job, read-only).
name: Aplicar migration (manual)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'arquivo = aplica um | pendentes = fila do que falta | registrar = anota sem executar | verificar = testes de RLS'
        required: true
        default: arquivo
        type: choice
        options:
          - arquivo
          - pendentes
          - registrar
          - verificar
      arquivo:
        description: 'Nome do arquivo em supabase/migrations (obrigatorio no modo arquivo)'
        required: false
        default: ''
        type: string
      confirmar:
        description: 'Digite APLICAR para gravar de verdade; qualquer outro valor faz apenas dry-run'
        required: true
        default: dry-run
        type: string
      ref:
        description: 'Branch de onde ler os arquivos (vazio = branch padrao). Permite aplicar a migration de uma PR antes do merge'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 12 * * 1'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/migrations.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: migrations-producao
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Conferir credencial
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL ausente no repositorio"; exit 1
          fi
          psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "select current_user" >/dev/null
          echo "credencial ok"

      - name: Validar arquivo de entrada
        if: inputs.modo == 'arquivo' || inputs.modo == 'registrar'
        id: alvo
        env:
          ENTRADA: ${{ inputs.arquivo }}
        run: |
          set -euo pipefail
          ARQUIVO="$ENTRADA"
          if [ -z "$ARQUIVO" ]; then
            echo "::error::Informe o nome do arquivo (ex.: 20261123120000_user_preferences.sql)"; exit 1
          fi
          if ! printf '%s' "$ARQUIVO" | grep -qE '^[0-9]{14}_[A-Za-z0-9_-]+\.sql$'; then
            echo "::error::Nome invalido: $ARQUIVO (esperado AAAAMMDDHHMMSS_nome.sql)"; exit 1
          fi
          if [ ! -f "supabase/migrations/$ARQUIVO" ]; then
            echo "::error::Arquivo nao encontrado em supabase/migrations: $ARQUIVO"; exit 1
          fi
          versao="${ARQUIVO%%_*}"
          {
            echo "ARQUIVO=$ARQUIVO"
            echo "VERSAO=$versao"
            echo "CHECKSUM=$(sha256sum "supabase/migrations/$ARQUIVO" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Conferir se a versao ja foi aplicada
        if: inputs.modo == 'arquivo' || inputs.modo == 'registrar'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          registros=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 \
            -c "select count(*) from public.schema_migrations where version = '${VERSAO}'")
          echo "registros em public.schema_migrations para ${VERSAO}: ${registros}"
          if [ "$registros" != "0" ]; then
            echo "::error::Versao ${VERSAO} ja aplicada (${ARQUIVO}). Nada a fazer."; exit 1
          fi

      - name: Registrar sem executar
        if: inputs.modo == 'registrar' && inputs.confirmar == 'APLICAR'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          resultado=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 \
            -c "select public.apply_migration('${VERSAO}', '${ARQUIVO}', '${CHECKSUM}')")
          echo "apply_migration(${VERSAO}) -> ${resultado}"
          if [ "$resultado" != "t" ]; then
            echo "::error::A versao ${VERSAO} ja consta no historico; nada a registrar"; exit 1
          fi
          echo "registrada sem execucao: ${ARQUIVO} (SQL nao rodou; use somente quando o banco ja tem o objeto)"

      - name: Dry-run (executa e reverte dentro da mesma sessao)
        if: inputs.modo == 'arquivo' && inputs.confirmar != 'APLICAR'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Seis arquivos do repositorio trazem BEGIN;/COMMIT; proprios. Dentro do begin/rollback
          # abaixo, o COMMIT do arquivo encerra a transacao externa e grava de verdade (o rollback
          # seguinte vira no-op) -- enquanto o step anuncia "nada foi gravado". Neutraliza essas
          # linhas e mantem a numeracao, para o erro de SQL continuar apontando a linha certa.
          sed -E 's/^([[:space:]]*)(begin|commit|rollback)([[:space:]]+(work|transaction))?([[:space:]]*;.*)$/\1-- dry-run: \2 neutralizado/I' \
            "supabase/migrations/${ARQUIVO}" > /tmp/dryrun.sql
          if grep -Eiq '^[[:space:]]*(begin|commit|rollback)([[:space:]]+(work|transaction))?[[:space:]]*;' /tmp/dryrun.sql; then
            echo "::error::sobrou comando de transacao em ${ARQUIVO}; recusando um dry-run que poderia gravar"
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c 'begin;' -f /tmp/dryrun.sql -c 'rollback;'
          echo "dry-run ok: ${ARQUIVO} executou sem erro e foi revertido. Nada foi gravado."

      - name: Aplicar em producao
        if: inputs.modo == 'arquivo' && inputs.confirmar == 'APLICAR'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Mesmo motivo do dry-run: o COMMIT; do arquivo encerraria o --single-transaction e as
          # statements seguintes rodariam fora de transacao (aplicacao pela metade se algo falhar).
          sed -E 's/^([[:space:]]*)(begin|commit|rollback)([[:space:]]+(work|transaction))?([[:space:]]*;.*)$/\1-- aplicar: \2 neutralizado (--single-transaction faz o papel)/I' \
            "supabase/migrations/${ARQUIVO}" > /tmp/aplicar.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q \
            -f /tmp/aplicar.sql
          psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 \
            -c "select public.apply_migration('${VERSAO}', '${ARQUIVO}', '${CHECKSUM}')"
          echo "aplicada: ${ARQUIVO}"

      - name: Levantar a fila (arquivos sem registro no banco)
        if: inputs.modo == 'pendentes' || github.event_name == 'schedule'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Duas fontes, porque o projeto grava em duas tabelas:
          #   supabase_migrations.schema_migrations -> historico nativo (tem coluna name)
          #   public.schema_migrations             -> registro do public.apply_migration
          # Ler so uma delas faz migration aplicada parecer pendente (ou o contrario).
          nativa=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "select to_regclass('supabase_migrations.schema_migrations') is not null")
          : > /tmp/aplicadas.txt
          : > /tmp/aplicadas_slugs.txt
          : > /tmp/versoes_sem_nome.txt
          if [ "$nativa" = "t" ]; then
            psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "select coalesce(name, '') from supabase_migrations.schema_migrations" | grep -v '^$' > /tmp/aplicadas.txt
            psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "select version from supabase_migrations.schema_migrations where name is null" | sort -u > /tmp/versoes_sem_nome.txt
          else
            echo "::warning::supabase_migrations.schema_migrations inacessivel; comparando apenas public.schema_migrations"
          fi
          psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "select name from public.schema_migrations" | grep -v '^$' >> /tmp/aplicadas.txt
          # Nome gravado varia: com prefixo de versao, sem prefixo, ou com .sql no fim.
          # Normaliza para comparar com o nome do arquivo sem extensao.
          sed -E 's/\.sql$//' /tmp/aplicadas.txt | sort -u > /tmp/aplicadas_norm.txt
          mv /tmp/aplicadas_norm.txt /tmp/aplicadas.txt
          sed -E 's/^[0-9]{14}_//' /tmp/aplicadas.txt | sort -u > /tmp/aplicadas_slugs.txt
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | grep -E '^[0-9]{14}_[A-Za-z0-9_-]+\.sql$' | sort > /tmp/arquivos.txt
          sed -E 's/\.sql$//' /tmp/arquivos.txt > /tmp/nomes.txt
          sed -E 's/^([0-9]{14})_.*/\1/' /tmp/arquivos.txt | sort > /tmp/versoes_brutas.txt
          echo "arquivos no repositorio: $(wc -l < /tmp/arquivos.txt)"
          echo "nomes registrados no historico: $(wc -l < /tmp/aplicadas.txt)"
          erro_colisao=0
          for v in $(uniq -d /tmp/versoes_brutas.txt || true); do
            arquivos_dup=$(grep "^${v}_" /tmp/arquivos.txt | tr '\n' ' ')
            faltando=""
            for a in $arquivos_dup; do
              aplicar_nome="${a%%.sql}"
              if ! grep -qx "$aplicar_nome" /tmp/aplicadas.txt && ! grep -qx "${aplicar_nome#*_}" /tmp/aplicadas_slugs.txt; then
                faltando="$faltando $a"
              fi
            done
            if [ -n "$faltando" ]; then
              echo "::error::version ${v} esta ocupada no historico e estes arquivos nao tem registro de aplicacao:$faltando"
              echo "::error::renumere o arquivo para uma versao nova; com a versao repetida o registro nao acontece"
              erro_colisao=1
            else
              echo "::warning::version ${v} tem dois arquivos, mas ambos constam no historico: ${arquivos_dup}"
            fi
          done
          if [ "$erro_colisao" = "1" ]; then
            echo "COLISAO=1" >> "$GITHUB_ENV"
            echo "::warning::ha versao ocupada sem registro; o diagnostico segue, mas a aplicacao da fila sera bloqueada"
          fi
          : > /tmp/pendentes.txt
          while read -r nome; do
            grep -qx "$nome" /tmp/aplicadas.txt && continue
            grep -qx "${nome#*_}" /tmp/aplicadas_slugs.txt && continue
            grep -qx "${nome%%_*}" /tmp/versoes_sem_nome.txt && continue
            echo "$nome" >> /tmp/pendentes.txt
          done < /tmp/nomes.txt
          echo "pendentes: $(wc -l < /tmp/pendentes.txt)"
          while read -r nome; do
            echo "::warning::pendente ${nome}.sql"
          done < /tmp/pendentes.txt
          echo "PENDENTES=$(tr '\n' ' ' < /tmp/pendentes.txt)" >> "$GITHUB_ENV"

      - name: Aplicar a fila em ordem
        if: inputs.modo == 'pendentes' && inputs.confirmar == 'APLICAR'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ "${COLISAO:-0}" = "1" ]; then
            echo "::error::fila bloqueada: existe arquivo com versao ja ocupada no historico (ver avisos do levantamento). Renumere e rode de novo."
            exit 1
          fi
          if [ -z "${PENDENTES:-}" ]; then echo "nada pendente"; exit 0; fi
          for nome in $PENDENTES; do
            arquivo="${nome}.sql"
            v="${nome%%_*}"
            echo "::group::Aplicando ${arquivo}"
            sed -E 's/^([[:space:]]*)(begin|commit|rollback)([[:space:]]+(work|transaction))?([[:space:]]*;.*)$/\1-- aplicar: \2 neutralizado (--single-transaction faz o papel)/I' \
              "supabase/migrations/${arquivo}" > /tmp/fila.sql
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q \
              -f /tmp/fila.sql
            checksum=$(sha256sum "supabase/migrations/${arquivo}" | cut -d' ' -f1)
            psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 \
              -c "select public.apply_migration('${v}', '${arquivo}', '${checksum}')"
            echo "aplicada: ${arquivo}"
            echo "::endgroup::"
          done

      - name: Testes de RLS (transacao revertida em cada arquivo)
        if: inputs.modo == 'verificar' || github.event_name == 'pull_request' || github.event_name == 'schedule'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          testes=(supabase/tests/*_rls_test.sql)
          if [ ${#testes[@]} -eq 0 ]; then
            echo "::error::Nenhum supabase/tests/*_rls_test.sql encontrado"; exit 1
          fi
          for t in "${testes[@]}"; do
            echo "::group::${t}"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$t"
            echo "::endgroup::"
          done
          echo "todos os testes de RLS passaram"

      - name: Avisar a fila pendente (semanal)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          titulo="Migrations pendentes no banco de producao"
          existente=$(gh issue list --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title == \"${titulo}\")][0].number // empty")
          if [ -z "${PENDENTES:-}" ]; then
            if [ -n "$existente" ]; then
              gh issue close "$existente" --comment "Fila zerada em $(date -u +%Y-%m-%d): todas as migrations do repositorio estao registradas em public.schema_migrations."
            else
              echo "nada pendente; nenhuma issue aberta"
            fi
            exit 0
          fi
          quantidade=$(wc -w <<< "$PENDENTES")
          lista=$(for nome in $PENDENTES; do echo "- ${nome}.sql"; done)
          corpo=$(printf 'A fila tem %s arquivo(s) em supabase/migrations/ sem registro em public.schema_migrations:\n\n%s\n\nPara aplicar: Actions > "Aplicar migration (manual)" > modo pendentes, confirmar APLICAR.\n\nEsta issue fecha sozinha na proxima execucao semanal, quando a fila zerar.' "$quantidade" "$lista")
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body "$corpo"
          else
            gh issue create --title "$titulo" --body "$corpo"
          fi
