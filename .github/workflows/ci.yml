name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint • Type-check • Test • Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: e2e

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Guard • Integridade das instruções para agentes (AGENTS.md + docs/agentes/)
        run: |
          git fetch --no-tags --depth=1 origin main
          AGENTS_MD_BASE=FETCH_HEAD node scripts/ci/check-claude-md-integrity.mjs

      - name: Guard • parseInt/parseFloat proibidos fora de safe-number.ts
        run: node scripts/codemod-safe-number.mjs --check

      - name: Guard • Edge Functions com coerção numérica insegura
        run: node scripts/guard-edge-numeric.mjs --check

      - name: Guard • Gravações cegas no cliente Supabase
        run: node scripts/guard-supabase-error.mjs --check

      - name: Guard • verify_jwt declarado em toda edge function (etapa 054)
        run: node scripts/ci/check-verify-jwt.mjs

      - name: Guard • Auditoria estática das Edge Functions
        run: bun scripts/audit-edge-functions.ts

      - name: Lint
        run: bun run lint
        continue-on-error: false

      - name: Type-check
        run: bun run type-check

      - name: Unit tests (Vitest)
        run: bunx vitest run --reporter=default --coverage
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: E2E tests (Playwright)
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
          bunx playwright install chromium --with-deps
          bunx playwright test
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}

      - name: Upload capturas da conferencia de celular (etapa 270)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturas-270
          path: capturas/270/
          retention-days: 7
          if-no-files-found: ignore

      - name: Edge Function Tests (Deno)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          deno test -A supabase/functions/

      # `deno test` nao faz typecheck. Sem este passo, erro de tipo em edge
      # function (ex.: propriedade inexistente em opcao de retry) passa o CI
      # e so quebra em producao.
      - name: Edge Function Type-check (Deno)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          shopt -s nullglob
          : > /tmp/files.txt
          for f in supabase/functions/*/index.ts supabase/functions/_shared/*.ts; do
            case "$f" in *__tests__*|*.test.ts) continue;; esac
            echo "$f" >> /tmp/files.txt
          done
          echo "types a verificar: $(wc -l < /tmp/files.txt)"
          # 8 em paralelo: sequencial levava >30min nas 96 edges
          xargs -a /tmp/files.txt -P 8 -I{} sh -c \
            'deno check --quiet "{}" 2>/tmp/err.$$$$.log || { echo "::error file={}::falha no type-check Deno"; cat /tmp/err.$$$$.log; exit 255; }' \
            && echo "type-check OK" || exit 1

      - name: Build
        run: bun run build

      - name: Guard • Bundle budget por rota
        run: node scripts/check-bundle-budget.mjs

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  security:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Audit dependencies
        run: bun audit || true
      # Etapa 041: o passo acima so imprime. Este reprova quando a contagem de
      # vulnerabilidades sobe em relacao a scripts/audit-baseline.json.
      - name: Guard • Vulnerabilidades nao aumentaram
        run: node scripts/check-audit-baseline.mjs
