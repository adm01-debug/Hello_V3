name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint • Type-check • Test • Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Guard • Integridade das instruções para agentes (AGENTS.md + docs/agentes/)
        run: |
          git fetch --no-tags --depth=1 origin main
          AGENTS_MD_BASE=FETCH_HEAD node scripts/ci/check-claude-md-integrity.mjs

      - name: Guard • parseInt/parseFloat proibidos fora de safe-number.ts
        run: node scripts/codemod-safe-number.mjs --check

      - name: Guard • Edge Functions com coerção numérica insegura
        run: node scripts/guard-edge-numeric.mjs --check

      - name: Lint
        run: bun run lint
        continue-on-error: false

      - name: Type-check
        run: bun run type-check

      - name: Unit tests (Vitest)
        run: bunx vitest run --reporter=default --coverage
        env:
          CI: true

      - name: E2E tests (Playwright)
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
          bunx playwright install chromium --with-deps
          bunx playwright test
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}

      - name: E2E diagnostic dump (temp)
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          echo '=== PLAYWRIGHT ERROR CONTEXTS ==='
          find test-results -name 'error-context.md' -print -exec cat {} \; 2>/dev/null || true
          echo '=== TEST RESULTS TREE ==='
          find test-results -maxdepth 2 -type f | head -100
          echo '=== NETWORK CHECKS (runner -> Supabase) ==='
          echo 'SUPABASE_URL:' ${VITE_SUPABASE_URL:-UNSET}
          bun -e '
            const url = process.env.VITE_SUPABASE_URL, key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY;
            const email = process.env.E2E_ADMIN_EMAIL, pass = process.env.E2E_ADMIN_PASSWORD;
            (async () => {
              const t0 = Date.now();
              const lr = await fetch(url + "/auth/v1/token?grant_type=password", { method: "POST", headers: { apikey: key, "content-type": "application/json" }, body: JSON.stringify({ email, password: pass }) });
              const lj = await lr.json();
              console.log("LOGIN", lr.status, (Date.now() - t0) + "ms", lj.error || "ok");
              if (!lj.access_token) return;
              const tok = lj.access_token;
              const t1 = Date.now();
              const pr = await fetch(url + "/rest/v1/user_profiles?id=eq." + lj.user.id, { headers: { apikey: key, Authorization: "Bearer " + tok } });
              const pj = await pr.json();
              console.log("PROFILE", pr.status, (Date.now() - t1) + "ms", JSON.stringify({ count: Array.isArray(pj) ? pj.length : "?", first: pj[0] ? { role: pj[0].role, id: (pj[0].id || "").slice(0, 8) } : pj }));
              const t2 = Date.now();
              const rr = await fetch(url + "/rest/v1/rpc/get_dashboard_stats", { method: "POST", headers: { apikey: key, Authorization: "Bearer " + tok, "content-type": "application/json" }, body: "{}" });
              const rj = await rr.json();
              console.log("RPC", rr.status, (Date.now() - t2) + "ms", JSON.stringify(rj).slice(0, 150));
            })().catch(e => console.log("ERR", e.message));
          '

      - name: Edge Function Tests (Deno)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          deno test -A supabase/functions/


      - name: Build
        run: bun run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  security:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Audit dependencies
        run: bun audit || true
