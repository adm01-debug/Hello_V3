# Deploy manual de uma edge function em producao.
#
# Por que existe: nenhum workflow do repositorio publicava edges — o deploy era
# feito a mao no painel. Uma correcao em uma edge so chegava em producao se
# alguem lembrasse de publicar; foi assim que as RPCs de lockout acabaram
# expostas para anon sem ninguem notar.
#
# Uso: Actions > "Deploy edge function" > Run workflow
#   function: login-attempt
#   ref:      branch/tag/commit com o codigo (vazio = branch do disparo)
#
# O verify_jwt de cada function vem de supabase/config.toml versionado: a CLI le
# esse arquivo, entao function chamada por pg_cron com token opaco continua
# entrando com verify_jwt = false sem precisar de nenhuma flag extra.
name: Deploy edge function

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Pasta em supabase/functions (ex: login-attempt)'
        required: true
        type: string
      ref:
        description: 'Branch/tag/commit com o codigo (vazio = branch do disparo)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FUNCTION: ${{ inputs.function }}
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Conferir secret
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN ausente no repositorio"; exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}

      - name: Conferir que a function existe no ref disparado
        run: |
          set -euo pipefail
          if [ ! -f "supabase/functions/${FUNCTION}/index.ts" ]; then
            echo "::error::supabase/functions/${FUNCTION}/index.ts nao existe em ${REF}"; exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        run: |
          set -euo pipefail
          supabase functions deploy "${FUNCTION}" --project-ref cfmlmcdyjuotqobjapng
