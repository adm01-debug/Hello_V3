apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-config
  namespace: production
data:
  # Application Config
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  
  # Feature Flags
  FEATURE_ANALYTICS: "true"
  FEATURE_NOTIFICATIONS: "true"
  FEATURE_WEBHOOKS: "true"
  
  # API Endpoints
  API_BASE_URL: "https://api.hello.app"
  WS_URL: "wss://ws.hello.app"
  
  # Cache Config
  CACHE_TTL: "3600"
  CACHE_MAX_SIZE: "1000"
  
  # Rate Limiting
  RATE_LIMIT_WINDOW: "60000"
  RATE_LIMIT_MAX: "100"
  
  # Monitoring
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  SENTRY_ENABLED: "true"
