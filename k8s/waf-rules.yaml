apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-waf
  annotations:
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyLimit 13107200
      SecRule REQUEST_HEADERS:User-Agent "bot|crawler|spider" "id:1001,deny,status:403,msg:'Bot detected'"
      SecRule ARGS "@rx (?i:union.*select|insert.*into|delete.*from)" "id:1002,deny,status:403,msg:'SQL injection attempt'"
      SecRule ARGS "@rx (?i:<script|javascript:|onerror=)" "id:1003,deny,status:403,msg:'XSS attempt'"
spec:
  ingressClassName: nginx
  rules:
    - host: hello.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
    - host: api.hello.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-api
                port:
                  number: 8080
