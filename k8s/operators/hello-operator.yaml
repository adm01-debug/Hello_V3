apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hello-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-operator
spec:
  selector:
    matchLabels:
      app: hello-operator
  template:
    metadata:
      labels:
        app: hello-operator
    spec:
      serviceAccountName: hello-operator
      containers:
        - name: operator
          image: hello-operator:latest
