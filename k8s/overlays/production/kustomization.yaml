apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

commonLabels:
  app: hello
  env: production

resources:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: hello-config
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=info

replicas:
  - name: hello
    count: 5
