apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: hello-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: hello-tls
      hosts:
        - "api.hello.app"
        - "hello.app"
        - "www.hello.app"
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
      tls:
        httpsRedirect: true
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hello-api
  namespace: default
spec:
  hosts:
    - "api.hello.app"
  gateways:
    - hello-gateway
  http:
    - match:
        - uri:
            prefix: "/v1"
      route:
        - destination:
            host: hello-api
            port:
              number: 8080
      retries:
        attempts: 3
        perTryTimeout: 2s
      timeout: 10s
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: hello-auth
  namespace: default
spec:
  selector:
    matchLabels:
      app: hello-api
  action: ALLOW
  rules:
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
            paths: ["/v1/*"]
      when:
        - key: request.auth.claims[iss]
          values: ["https://hello.app"]
---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: hello-jwt
  namespace: default
spec:
  selector:
    matchLabels:
      app: hello-api
  jwtRules:
    - issuer: "https://hello.app"
      jwksUri: "https://hello.app/.well-known/jwks.json"
      audiences:
        - "hello-api"
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: hello-circuit-breaker
  namespace: default
spec:
  host: hello-api
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 40
