apiVersion: v1
kind: ConfigMap
metadata:
  name: cost-alerts
data:
  alert-rules.yml: |
    groups:
      - name: cost_alerts
        interval: 1h
        rules:
          - alert: HighInfrastructureCost
            expr: sum(aws_cost_monthly) > 2000
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Infrastructure cost exceeded $2000/month"
          
          - alert: CostSpike
            expr: rate(aws_cost_daily[1h]) > 100
            for: 30m
            labels:
              severity: critical
            annotations:
              summary: "Sudden cost spike detected"
