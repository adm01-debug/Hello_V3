apiVersion: v1
kind: Service
metadata:
  name: hello-blue
spec:
  selector:
    app: hello
    version: blue
  ports:
    - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-green
spec:
  selector:
    app: hello
    version: green
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-bg
spec:
  rules:
    - host: hello.app
      http:
        paths:
          - path: /
            backend:
              service:
                name: hello-blue
                port:
                  number: 80
